<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Architect Challenge: Quest for AGI</title>
    <script>
      // Browser environment fetch guard to prevent "Cannot set property fetch of #<Window>" errors
      (function() {
        try {
          var origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return origFetch; },
            set: function(val) { origFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch(e) {
          // ignore if already defined
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
